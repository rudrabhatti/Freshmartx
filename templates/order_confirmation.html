{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmed - FreshMartX</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-green-50 text-center flex items-center justify-center min-h-screen">

  <div class="bg-white p-10 rounded-lg shadow-lg max-w-md w-full">
    <video autoplay loop muted class="w-100 h-100 mx-auto mb-4">
      <source src="{% static 'videos/checkmark.mp4' %}" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <h1 class="text-2xl font-bold text-green-600 mb-2">Order Confirmed!</h1>
    <p class="text-gray-700 mb-4">Thank you for shopping with FreshMartX.</p>
    <p class="text-lg font-medium text-gray-800 mb-6">Your order will be delivered soon. <br> Payment: <strong>Cash on Delivery</strong>.</p>

    <a href="{% url 'index' %}" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition">Back to Home</a>
  </div>

</body>
</html>
